name: Build ARTIVA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as ZIP
        run: |
          if [ -z "$(find . -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \))" ]; then
            for z in *.zip; do
              [ -f "$z" ] && unzip -q -o "$z"
            done
          fi

      - name: Locate Gradle project directory
        id: find_project
        run: |
          SETTINGS_FILE=$(find . -maxdepth 4 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: لم يتم العثور على ملفات المشروع داخل المستودع!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Gradle project in: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTIVA-Games-Debug-APK
          path: ${{ steps.find_project.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTIVA-Games-Release-APK
          path: ${{ steps.find_project.outputs.dir }}/app/build/outputs/apk/release/*.apk
